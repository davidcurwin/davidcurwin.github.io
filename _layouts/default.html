<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="brand">
        <a class="brand__title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <div class="brand__subtitle">Independent scholar and author</div>
      </div>
      {% include nav.html %}
    </div>
  </header>

  <main class="wrap">
    {% if page.heading %}
      <h1 class="page-title">{{ page.heading }}</h1>
    {% elsif page.title and page.layout != 'home' %}
      <h1 class="page-title">{{ page.title }}</h1>
    {% endif %}

    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>© {{ 'now' | date: '%Y' }} {{ site.title }}</div>
    </div>
  </footer>
</body>
</html>
